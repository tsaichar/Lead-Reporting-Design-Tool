<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.1);--border-s:rgba(0,0,0,.18);
  --text:#1a1a18;--text2:#5a5a54;--text3:#9a9990;
  --radius:8px;--radius-lg:12px;--chev-h:42px;
  --mql-50:#EEEDFE;--mql-200:#AFA9EC;--mql-400:#7F77DD;--mql-600:#534AB7;--mql-800:#3C3489;
  --sal-50:#E1F5EE;--sal-200:#5DCAA5;--sal-400:#1D9E75;--sal-600:#0F6E56;--sal-800:#085041;
  --sql-50:#E6F1FB;--sql-200:#85B7EB;--sql-400:#378ADD;--sql-600:#185FA5;--sql-800:#0C447C;
  --gray-50:#F1EFE8;--gray-200:#B4B2A9;--gray-400:#888780;--gray-800:#444441;
  --red-50:#FCEBEB;--red-200:#F09595;--red-400:#E24B4A;--red-600:#A32D2D;--red-800:#791F1F;
  --warn-bg:#FAEEDA;--warn-t:#633806;--warn-b:#EF9F27;
  --dan-bg:#FCEBEB;--dan-t:#791F1F;--dan-b:#E24B4A;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#131312;--surface:#1c1c1a;--surface2:#242422;
  --border:rgba(255,255,255,.1);--border-s:rgba(255,255,255,.18);
  --text:#e8e6df;--text2:#9a9890;--text3:#5a5a54;
  --mql-50:#26215C;--mql-200:#534AB7;--mql-800:#CECBF6;
  --sal-50:#04342C;--sal-200:#0F6E56;--sal-800:#9FE1CB;
  --sql-50:#042C53;--sql-200:#185FA5;--sql-800:#B5D4F4;
  --gray-50:#2c2c2a;--gray-200:#5F5E5A;--gray-800:#D3D1C7;
  --red-50:#501313;--red-200:#A32D2D;--red-800:#F7C1C1;
  --warn-bg:#412402;--warn-t:#FAC775;--warn-b:#854F0B;
  --dan-bg:#501313;--dan-t:#F7C1C1;--dan-b:#A32D2D;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;line-height:1.5}
header{background:var(--surface);border-bottom:.5px solid var(--border);padding:0 1.5rem;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.h-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.h-sub{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.h-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.hbtn{height:30px;padding:0 12px;font-size:11px;font-family:'Inter',sans-serif;border-radius:var(--radius);border:.5px solid var(--border-s);background:transparent;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .12s,color .12s;font-weight:500}
.hbtn:hover{background:var(--surface2);color:var(--text)}
.hbtn.primary{background:var(--mql-600);color:#fff;border-color:var(--mql-600)}
.hbtn.primary:hover{background:var(--mql-800);border-color:var(--mql-800)}
main{padding:1.5rem;max-width:1200px;margin:0 auto}
.path-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.25rem .85rem;margin-bottom:1rem}
.card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:.75rem}
.path-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.path-bar{display:flex;align-items:stretch;min-width:max-content}
.chevron{position:relative;display:flex;align-items:center;justify-content:center;height:var(--chev-h);min-width:118px;padding:0 22px 0 28px;cursor:pointer;user-select:none;font-size:11px;font-weight:500;white-space:nowrap;transition:opacity .12s,transform .1s}
.chevron:first-child{padding-left:14px;border-radius:6px 0 0 6px}
.chevron:last-child{border-radius:0 6px 6px 0}
.chevron::after{content:'';position:absolute;right:-15px;top:0;width:0;height:0;z-index:2;border-top:21px solid transparent;border-bottom:21px solid transparent;border-left:15px solid var(--cf)}
.chevron::before{content:'';position:absolute;right:-17px;top:0;width:0;height:0;z-index:1;border-top:21px solid transparent;border-bottom:21px solid transparent;border-left:15px solid var(--cb)}
.chevron:last-child::after,.chevron:last-child::before{display:none}
.chevron:hover{opacity:.82}
.chevron:active{transform:scale(.98)}
.chevron.open{outline:2px solid var(--mql-400);outline-offset:2px;z-index:10;border-radius:3px}
.c-mql-s {--cf:#EEEDFE;--cb:#AFA9EC;background:#EEEDFE;color:#3C3489}
.c-mql-w {--cf:#DDD9FD;--cb:#AFA9EC;background:#DDD9FD;color:#3C3489}
.c-mql-nr{--cf:#CECBF6;--cb:#7F77DD;background:#CECBF6;color:#3C3489}
.c-sal-ms{--cf:#E1F5EE;--cb:#5DCAA5;background:#E1F5EE;color:#085041}
.c-sal-nr{--cf:#C8EDE0;--cb:#1D9E75;background:#C8EDE0;color:#085041}
.c-sal-no{--cf:#9FE1CB;--cb:#0F6E56;background:#9FE1CB;color:#085041}
.c-sql   {--cf:#E6F1FB;--cb:#85B7EB;background:#E6F1FB;color:#0C447C}
.c-nal   {--cf:#F1EFE8;--cb:#B4B2A9;background:#F1EFE8;color:#444441}
.c-dq    {--cf:#FCEBEB;--cb:#F09595;background:#FCEBEB;color:#791F1F}
@media(prefers-color-scheme:dark){
  .c-mql-s {--cf:#3C3489;--cb:#534AB7;background:#3C3489;color:#CECBF6}
  .c-mql-w {--cf:#2e2870;--cb:#534AB7;background:#2e2870;color:#CECBF6}
  .c-mql-nr{--cf:#26215C;--cb:#3C3489;background:#26215C;color:#AFA9EC}
  .c-sal-ms{--cf:#085041;--cb:#0F6E56;background:#085041;color:#9FE1CB}
  .c-sal-nr{--cf:#063d32;--cb:#0F6E56;background:#063d32;color:#9FE1CB}
  .c-sal-no{--cf:#04342C;--cb:#085041;background:#04342C;color:#5DCAA5}
  .c-sql   {--cf:#0C447C;--cb:#185FA5;background:#0C447C;color:#B5D4F4}
  .c-nal   {--cf:#444441;--cb:#5F5E5A;background:#444441;color:#D3D1C7}
  .c-dq    {--cf:#791F1F;--cb:#A32D2D;background:#791F1F;color:#F7C1C1}
}
.legend{display:flex;gap:1.25rem;margin-top:.75rem;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.leg-sw{width:22px;height:8px;border-radius:2px}
.detail-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;min-height:120px}
.detail-empty{padding:2.5rem 1.5rem;text-align:center;color:var(--text3)}
.detail-empty i{font-size:26px;display:block;margin-bottom:.5rem;opacity:.4}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px}
@media(max-width:680px){.detail-grid{grid-template-columns:1fr}}
.d-main{padding:1.25rem 1.5rem;border-right:.5px solid var(--border)}
.d-side{padding:1.25rem;background:var(--surface2)}
.d-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:.85rem}
.d-name{font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1}
.stage-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;border:.5px solid;white-space:nowrap;font-family:'JetBrains Mono',monospace;margin-top:3px}
.sp-mql  {background:var(--mql-50);border-color:var(--mql-200);color:var(--mql-800)}
.sp-sal  {background:var(--sal-50);border-color:var(--sal-200);color:var(--sal-800)}
.sp-sql  {background:var(--sql-50);border-color:var(--sql-200);color:var(--sql-800)}
.sp-exit {background:var(--gray-50);border-color:var(--gray-200);color:var(--gray-800)}
.sp-exitr{background:var(--red-50);border-color:var(--red-200);color:var(--red-800)}
.d-def{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:.75rem}
.badge-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.85rem}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;border:.5px solid;display:inline-flex;align-items:center;gap:4px;font-weight:500}
.b-warn{background:var(--warn-bg);color:var(--warn-t);border-color:var(--warn-b)}
.b-nur {background:var(--surface2);color:var(--text3);border-color:var(--border-s)}
.b-perm{background:var(--dan-bg);color:var(--dan-t);border-color:var(--dan-b)}
.divider{border:none;border-top:.5px solid var(--border);margin:.85rem 0}
.sect-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.sect-lbl::after{content:'';flex:1;height:.5px;background:var(--border)}
.auto-item{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text2);line-height:1.5;padding:6px 8px;border-radius:var(--radius);background:var(--surface);border:.5px solid var(--border);margin-bottom:4px}
.auto-item i.ci{font-size:13px;color:var(--text3);flex-shrink:0;margin-top:1px}
.auto-item .at{flex:1}
.auto-item .at strong{font-weight:500;color:var(--text)}
.a-del{cursor:pointer;color:var(--text3);font-size:11px;padding:1px 3px;border-radius:4px;flex-shrink:0}
.a-del:hover{color:var(--red-600);background:var(--red-50)}
.auto-empty{font-size:11px;color:var(--text3);font-style:italic;padding:4px 0}
.add-row{display:flex;gap:5px;flex-wrap:wrap}
select,input[type=text],textarea{font-family:'Inter',sans-serif;font-size:12px;background:var(--surface);color:var(--text);border:.5px solid var(--border-s);border-radius:var(--radius)}
select{height:30px;padding:0 8px;cursor:pointer}
input[type=text]{height:30px;padding:0 9px;flex:1;min-width:80px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--mql-400)}
textarea{width:100%;padding:7px 9px;resize:vertical;min-height:70px;line-height:1.55}
.abtn,.sbtn,.cbtn,.ebtn{height:30px;padding:0 10px;font-size:11px;font-weight:500;font-family:'Inter',sans-serif;border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background .12s;white-space:nowrap}
.abtn{background:transparent;border:.5px solid var(--border-s);color:var(--text2)}
.abtn:hover{background:var(--surface2);color:var(--text)}
.sbtn{background:var(--mql-600);border:.5px solid var(--mql-600);color:#fff}
.sbtn:hover{background:var(--mql-800)}
.cbtn{background:transparent;border:.5px solid var(--border);color:var(--text3)}
.cbtn:hover{background:var(--surface2)}
.ebtn{background:transparent;border:.5px solid var(--border);color:var(--text3);font-size:11px;height:26px}
.ebtn:hover{background:var(--surface2);color:var(--text)}
.notes-ta{margin-top:.5rem;min-height:80px}
.nav-item{padding:5px 8px;border-radius:var(--radius);cursor:pointer;margin-bottom:3px;font-size:11px;display:flex;align-items:center;gap:6px;border:.5px solid transparent;transition:background .1s}
.nav-item:hover{background:var(--surface)}
.nav-item.active{font-weight:600;background:var(--surface);border-color:var(--border-s)}
.counter{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-left:auto}
.def-btn-row{display:flex;gap:5px;margin-top:5px}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<header>
  <div>
    <div class="h-title">Lead Funnel</div>
    <div class="h-sub">status reference &amp; workflow tool</div>
  </div>
  <div class="h-actions">
    <button class="hbtn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
    <button class="hbtn primary" onclick="shareFile()"><i class="ti ti-share"></i> Share file</button>
  </div>
</header>

<main>
  <div class="path-card">
    <div class="card-label">Lead status path — click any stage to view details</div>
    <div class="path-scroll">
      <div class="path-bar" id="path-bar"></div>
    </div>
    <div class="legend">
      <span class="leg"><span class="leg-sw" style="background:linear-gradient(90deg,#EEEDFE,#CECBF6)"></span>MQL stages</span>
      <span class="leg"><span class="leg-sw" style="background:linear-gradient(90deg,#E1F5EE,#9FE1CB)"></span>SAL stages</span>
      <span class="leg"><span class="leg-sw" style="background:#E6F1FB"></span>SQL</span>
      <span class="leg"><span class="leg-sw" style="background:#F1EFE8"></span>Not a lead</span>
      <span class="leg"><span class="leg-sw" style="background:#FCEBEB"></span>Disqualified</span>
    </div>
  </div>
  <div class="detail-card" id="detail-card">
    <div class="detail-empty">
      <i class="ti ti-hand-finger"></i>
      Select a status above to view its definition, automations, and workflow notes
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
var AUTOCAT=[
  {value:'email',    label:'Email',        icon:'ti-mail'},
  {value:'task',     label:'Task',         icon:'ti-check'},
  {value:'sequence', label:'Sequence',     icon:'ti-player-play'},
  {value:'notify',   label:'Notify',       icon:'ti-bell'},
  {value:'field',    label:'Field update', icon:'ti-edit'},
  {value:'workflow', label:'Workflow',     icon:'ti-settings'}
];
function catIcon(v){for(var i=0;i<AUTOCAT.length;i++){if(AUTOCAT[i].value===v)return AUTOCAT[i].icon;}return 'ti-bolt';}
function catLabel(v){for(var i=0;i<AUTOCAT.length;i++){if(AUTOCAT[i].value===v)return AUTOCAT[i].label;}return v;}

var STATUSES=[
  {id:'mql-s', cc:'c-mql-s', label:'MQL \u2014 suspect',       short:'Suspect',        stage:'MQL',  sp:'sp-mql',  dot:'#7F77DD', def:'Lead received but not yet reviewed by SDR for ICP confirmation.',                                                 trigger:'',                        nurture:false,permanent:false,automations:[],notes:''},
  {id:'mql-w', cc:'c-mql-w', label:'MQL \u2014 working',       short:'Working',        stage:'MQL',  sp:'sp-mql',  dot:'#7F77DD', def:'SDR reviewed, confirmed ICP, actively reaching out to establish contact.',                                         trigger:'',                        nurture:false,permanent:false,automations:[],notes:''},
  {id:'mql-nr',cc:'c-mql-nr',label:'MQL \u2014 no response',   short:'No response',    stage:'MQL',  sp:'sp-mql',  dot:'#534AB7', def:'SDR reached out multiple times with no connection made. Lead went cold before any conversation.',                   trigger:'',                        nurture:true, permanent:false,automations:[],notes:''},
  {id:'sal-ms',cc:'c-sal-ms',label:'SAL \u2014 mtg scheduled', short:'Mtg scheduled',  stage:'SAL',  sp:'sp-sal',  dot:'#1D9E75', def:'SDR connected, completed BANT qualification, and scheduled a meeting as the next step.',                           trigger:'',                        nurture:false,permanent:false,automations:[],notes:''},
  {id:'sal-nr',cc:'c-sal-nr',label:'SAL \u2014 no response',   short:'No response',    stage:'SAL',  sp:'sp-sal',  dot:'#1D9E75', def:'Meeting was scheduled but lead ghosted before or after. Engagement stalled post-connection.',                       trigger:'',                        nurture:true, permanent:false,automations:[],notes:''},
  {id:'sal-no',cc:'c-sal-no',label:'SAL \u2014 no opportunity',short:'No opportunity', stage:'SAL',  sp:'sp-sal',  dot:'#0F6E56', def:'AE met with the lead and confirmed no opportunity at this time. Not permanent \u2014 eligible for re-entry.',       trigger:'',                        nurture:false,permanent:false,automations:[],notes:''},
  {id:'sql-ao',cc:'c-sql',   label:'SQL \u2014 added to opp',  short:'Added to opp',   stage:'SQL',  sp:'sp-sql',  dot:'#378ADD', def:'AE confirmed an opportunity exists. Conversation is progressing toward a deal.',                                    trigger:'',                        nurture:false,permanent:false,automations:[],notes:''},
  {id:'ex-nal',cc:'c-nal',   label:'Not a lead',               short:'Not a lead',     stage:'Exit', sp:'sp-exit', dot:'#888780', def:'Reviewed and confirmed outside the sales funnel \u2014 job seeker, support request, partner, or customer of a customer.',trigger:'Not a lead reason field',nurture:false,permanent:false,automations:[],notes:''},
  {id:'ex-dq', cc:'c-dq',    label:'Disqualified',             short:'Disqualified',   stage:'Exit', sp:'sp-exitr',dot:'#E24B4A', def:'SDR or AE confirmed ICP but determined there is no sales opportunity now or in the future. Permanent exit.',        trigger:'Disq. reason field',      nurture:false,permanent:true, automations:[],notes:''}
];

var openId=null;

function findStatus(id){for(var i=0;i<STATUSES.length;i++){if(STATUSES[i].id===id)return STATUSES[i];}return null;}

function esc(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

function save(){
  try{
    var d=STATUSES.map(function(s){return {id:s.id,def:s.def,automations:s.automations,notes:s.notes};});
    localStorage.setItem('lf3',JSON.stringify(d));
  }catch(e){}
}

function load(){
  try{
    var baked=window.__BAKED__;
    if(baked){for(var i=0;i<baked.length;i++){var p=baked[i],s=findStatus(p.id);if(s){s.def=p.def||s.def;s.automations=p.automations||[];s.notes=p.notes||'';}}}
    var raw=localStorage.getItem('lf3');
    if(raw){var parsed=JSON.parse(raw);for(var i=0;i<parsed.length;i++){var p=parsed[i],s=findStatus(p.id);if(s){s.def=p.def||s.def;s.automations=p.automations||[];s.notes=p.notes||'';}}}
  }catch(e){}
}

function buildBar(){
  var html='';
  for(var i=0;i<STATUSES.length;i++){
    var s=STATUSES[i];
    html+='<div class="chevron '+s.cc+(openId===s.id?' open':'')+'" onclick="toggle(\''+s.id+'\')" role="button" title="'+esc(s.label)+'">'+esc(s.label)+'</div>';
  }
  document.getElementById('path-bar').innerHTML=html;
}

function renderAutoList(s){
  if(!s.automations||s.automations.length===0)return '<p class="auto-empty">No automations added yet.</p>';
  var html='';
  for(var i=0;i<s.automations.length;i++){
    var a=s.automations[i];
    html+='<div class="auto-item"><i class="ti '+catIcon(a.type)+' ci"></i><span class="at"><strong>'+catLabel(a.type)+':</strong> '+esc(a.text)+'</span><span class="a-del" onclick="delAuto(\''+s.id+'\','+i+')" title="Remove"><i class="ti ti-x"></i></span></div>';
  }
  return html;
}

function renderDetail(sid){
  var s=findStatus(sid);if(!s)return;
  var badges='';
  if(s.trigger)badges+='<span class="badge b-warn"><i class="ti ti-alert-triangle"></i>Triggers: '+esc(s.trigger)+'</span>';
  if(s.nurture)badges+='<span class="badge b-nur"><i class="ti ti-refresh"></i>Nurture eligible</span>';
  if(s.permanent)badges+='<span class="badge b-perm"><i class="ti ti-lock"></i>Permanent exit</span>';
  var acOpts='';for(var i=0;i<AUTOCAT.length;i++){acOpts+='<option value="'+AUTOCAT[i].value+'">'+AUTOCAT[i].label+'</option>';}
  var navHTML='';
  for(var i=0;i<STATUSES.length;i++){
    var x=STATUSES[i];
    var cnt=x.automations.length>0?'<span class="counter">'+x.automations.length+'</span>':'';
    navHTML+='<div class="nav-item'+(x.id===sid?' active':'')+'" onclick="toggle(\''+x.id+'\')">'
      +'<span class="stage-pill '+x.sp+'" style="font-size:9px;padding:1px 5px">'+x.stage+'</span>'
      +esc(x.short)+cnt+'</div>';
  }
  document.getElementById('detail-card').innerHTML=
    '<div class="detail-grid">'
    +'<div class="d-main">'
    +'<div class="d-top"><div class="d-name">'+esc(s.label)+'</div><span class="stage-pill '+s.sp+'">'+s.stage+'</span></div>'
    +'<div id="dv-'+sid+'"><div class="d-def">'+esc(s.def)+'</div>'
    +'<button class="ebtn" onclick="editDef(\''+sid+'\')"><i class="ti ti-edit"></i> Edit definition</button></div>'
    +'<div id="de-'+sid+'" style="display:none"><textarea id="dta-'+sid+'">'+esc(s.def)+'</textarea>'
    +'<div class="def-btn-row"><button class="sbtn" onclick="saveDef(\''+sid+'\')"><i class="ti ti-check"></i> Save</button>'
    +'<button class="cbtn" onclick="cancelDef(\''+sid+'\')">Cancel</button></div></div>'
    +(badges?'<div class="badge-row" style="margin-top:.75rem">'+badges+'</div>':'')
    +'<div class="divider"></div>'
    +'<div class="sect-lbl">Automations &amp; workflow</div>'
    +'<div id="al-'+sid+'">'+renderAutoList(s)+'</div>'
    +'<div class="add-row"><select id="ac-'+sid+'">'+acOpts+'</select>'
    +'<input type="text" id="at-'+sid+'" placeholder="Describe the step or automation..." onkeydown="if(event.key===\'Enter\')addAuto(\''+sid+'\')">'
    +'<button class="abtn" onclick="addAuto(\''+sid+'\')"><i class="ti ti-plus"></i> Add</button></div>'
    +'</div>'
    +'<div class="d-side">'
    +'<div class="sect-lbl" style="margin-bottom:.6rem">Workflow notes</div>'
    +'<textarea class="notes-ta" id="nt-'+sid+'" placeholder="CRM field mappings, edge cases, owner, SLAs, open questions..." oninput="saveNotes(\''+sid+'\',this.value)">'+esc(s.notes)+'</textarea>'
    +'<div class="divider"></div>'
    +'<div class="sect-lbl" style="margin-bottom:.6rem">Quick navigation</div>'
    +navHTML
    +'</div></div>';
}

function toggle(id){
  openId=(openId===id)?null:id;
  buildBar();
  if(openId){
    renderDetail(openId);
    document.getElementById('detail-card').scrollIntoView({behavior:'smooth',block:'nearest'});
  }else{
    document.getElementById('detail-card').innerHTML='<div class="detail-empty"><i class="ti ti-hand-finger"></i>Select a status above to view its definition, automations, and workflow notes</div>';
  }
}

function editDef(id){document.getElementById('dv-'+id).style.display='none';document.getElementById('de-'+id).style.display='block';document.getElementById('dta-'+id).focus();}
function cancelDef(id){document.getElementById('dv-'+id).style.display='block';document.getElementById('de-'+id).style.display='none';}
function saveDef(id){var val=document.getElementById('dta-'+id).value.trim();if(!val)return;var s=findStatus(id);if(s)s.def=val;save();renderDetail(id);toast('Definition saved');}
function saveNotes(id,val){var s=findStatus(id);if(s){s.notes=val;save();}}
function addAuto(id){var cat=document.getElementById('ac-'+id).value;var txt=document.getElementById('at-'+id).value.trim();if(!txt)return;var s=findStatus(id);if(s)s.automations.push({type:cat,text:txt});save();document.getElementById('al-'+id).innerHTML=renderAutoList(s);document.getElementById('at-'+id).value='';toast('Automation added');}
function delAuto(id,idx){var s=findStatus(id);if(s)s.automations.splice(idx,1);save();document.getElementById('al-'+id).innerHTML=renderAutoList(s);}

function exportCSV(){
  var rows=[['Stage','Status','Definition','Triggers','Nurture eligible','Permanent exit','Automations','Notes']];
  for(var i=0;i<STATUSES.length;i++){
    var s=STATUSES[i],autos=[];
    for(var j=0;j<s.automations.length;j++){autos.push('['+catLabel(s.automations[j].type)+'] '+s.automations[j].text);}
    rows.push([s.stage,s.label,s.def,s.trigger,s.nurture?'Yes':'No',s.permanent?'Yes':'No',autos.join(' | '),s.notes]);
  }
  var csv='';
  for(var i=0;i<rows.length;i++){
    var cells=[];
    for(var j=0;j<rows[i].length;j++){cells.push('"'+String(rows[i][j]).replace(/"/g,'""')+'"');}
    csv+=cells.join(',')+'\n';
  }
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='lead-funnel-statuses.csv';
  a.click();
  toast('CSV exported');
}

function shareFile(){
  var data=STATUSES.map(function(s){return {id:s.id,def:s.def,automations:s.automations,notes:s.notes};});
  var baked=JSON.stringify(data);
  var so='<'+'script>';
  var sc='<'+'/script>';
  var block=so+'window.__BAKED__='+baked+';'+sc;
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  var out=src.replace('</head>',block+'</head>');
  var a=document.createElement('a');
  a.href='data:text/html;charset=utf-8,'+encodeURIComponent(out);
  a.download='lead-funnel-shared.html';
  a.click();
  toast('File downloaded \u2014 send lead-funnel-shared.html to share');
}

load();
buildBar();
</script>
